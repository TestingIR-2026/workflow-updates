<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/inflow-design-system-react-4656de98-77ff-4a43-9b32-0fad2779965b/inriver-design-tokens.css">
  <link rel="stylesheet" href="_ds/inflow-design-system-react-4656de98-77ff-4a43-9b32-0fad2779965b/styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">
  <script src="_ds/inflow-design-system-react-4656de98-77ff-4a43-9b32-0fad2779965b/_ds_bundle.js"></script>
  <style>
    body { margin: 0; background: #ebf1fc; font-family: 'Inter', sans-serif; }
    a { color: #0b2d6e; }
    a:hover { color: #003687; }
    @keyframes ivPanelIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  </style>
</helmet>

<div style="display:flex;height:100vh;width:100%;overflow:hidden;background:#ebf1fc;">
  <x-import component-from-global-scope="InriverDesignSystem_4656de.InriverAppNav" items="{{ navItems }}" footer="{{ navFooter }}" hint-size="80px,100%"></x-import>

  <div style="flex:1;display:flex;flex-direction:column;min-width:0;">
    <x-import component-from-global-scope="InriverDesignSystem_4656de.InriverGlobalHeader" logo-src="assets/inriver-logo-dark.png" search-placeholder="Search" avatar-text="AB" hint-size="100%,64px"></x-import>

    <div style="display:flex;align-items:center;gap:16px;min-height:76px;flex-shrink:0;padding:10px 24px;background:#ebf1fc;">
      <div style="font-size:22px;font-weight:700;color:#0b2d6e;letter-spacing:0.15px;line-height:1.2;">Page title</div>
      <button type="button" sc-camel-on-click="{{ openPanel }}" style="margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border:none;background:#0b2d6e;color:#fff;border-radius:5px;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;letter-spacing:0.1px;cursor:pointer;flex-shrink:0;" style-hover="background:#003687;">
        <span class="material-icons-outlined" style="font-size:20px;color:#fff;flex-shrink:0;">add</span>
        Open panel
      </button>
    </div>

    <div style="flex:1;background:#fff;overflow:auto;"></div>
  </div>
</div>

<sc-if value="{{ panelOpen }}" hint-placeholder-val="{{ true }}">
  <aside style="position:fixed;top:0;right:0;width:540px;height:100vh;background:#fff;border-left:1px solid #c2c6d8;box-shadow:-8px 0 28px rgba(0,0,0,0.16);z-index:50;display:flex;flex-direction:column;font-family:'Inter',sans-serif;animation:ivPanelIn .22s ease-out;">

    <sc-if value="{{ showMain }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:center;gap:14px;padding:16px 24px;flex-shrink:0;">
      <div style="font-size:22px;font-weight:700;color:#0b2d6e;letter-spacing:0.15px;">Entity automation</div>
      <span class="material-icons-outlined" sc-camel-on-click="{{ closePanel }}" style="margin-left:auto;font-size:24px;color:#0b2d6e;flex-shrink:0;cursor:pointer;">close</span>
    </div>

    <div style="flex:1;overflow:auto;padding:8px 24px 24px;">
      <x-import component-from-global-scope="InriverDesignSystem_4656de.TextField" label="Name" size="md" value="{{ name }}" on-change="{{ onNameChange }}" maxlength="50" hint-size="100%,56px"></x-import>
      <div style="margin-top:4px;text-align:right;font-size:12px;color:var(--color-on-surface-variant);">{{ counter }}</div>

      <div style="margin-top:16px;font-size:14px;font-weight:700;color:#0b2d6e;letter-spacing:0.15px;">Field automations</div>

      <sc-for list="{{ fieldAutomations }}" as="f" hint-placeholder-count="0">
        <div style="margin-top:12px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid #c2c6d8;border-radius:4px;background:#fff;">
          <div style="flex:1;min-width:0;">
            <div style="font-size:14px;font-weight:700;color:#0b2d6e;letter-spacing:0.15px;">{{ f.title }}</div>
            <div style="margin-top:2px;font-size:13px;line-height:18px;color:var(--color-on-surface-variant);">{{ f.detail }}</div>
          </div>
          <span class="material-icons-outlined" sc-camel-on-click="{{ f.edit }}" style="font-size:20px;color:#0b2d6e;cursor:pointer;flex-shrink:0;">edit</span>
          <span class="material-icons-outlined" sc-camel-on-click="{{ f.remove }}" style="font-size:20px;color:#0b2d6e;cursor:pointer;flex-shrink:0;">delete_outline</span>
        </div>
      </sc-for>

      <div style="padding-top:16px;">
        <x-import component-from-global-scope="InriverDesignSystem_4656de.Button" variant="outlined" size="small" on-click="{{ goToField }}" hint-size="auto,30px">Add field automation</x-import>
      </div>

      <div style="margin-top:24px;display:flex;align-items:flex-start;gap:12px;">
        <span class="material-icons-outlined" style="font-size:20px;color:#0b2d6e;flex-shrink:0;">info</span>
        <div style="font-size:13px;line-height:18px;color:var(--color-on-surface-variant);">Updates made by this automation will not trigger events.</div>
      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;gap:12px;padding:16px 24px 24px;flex-shrink:0;">
      <button type="button" sc-camel-on-click="{{ closePanel }}" style="height:40px;padding:0 22px;border:1px solid #c2c6d8;background:#fff;color:#0b2d6e;border-radius:5px;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;cursor:pointer;" style-hover="background:#ebf1fc;">Cancel</button>
      <button type="button" style="height:40px;padding:0 26px;border:none;background:#0b2d6e;color:#fff;border-radius:5px;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;letter-spacing:0.1px;cursor:pointer;" style-hover="background:#003687;">Done</button>
    </div>
    </sc-if>

    <sc-if value="{{ showField }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;gap:12px;padding:16px 24px;flex-shrink:0;">
      <span class="material-icons-outlined" sc-camel-on-click="{{ goToMain }}" style="font-size:24px;color:#0b2d6e;flex-shrink:0;cursor:pointer;">arrow_back</span>
      <div style="font-size:22px;font-weight:700;color:#0b2d6e;letter-spacing:0.15px;">Field automation configuration</div>
      <span class="material-icons-outlined" sc-camel-on-click="{{ closePanel }}" style="margin-left:auto;font-size:24px;color:#0b2d6e;flex-shrink:0;cursor:pointer;">close</span>
    </div>

    <div style="flex:1;overflow:auto;padding:8px 24px 24px;display:flex;flex-direction:column;gap:20px;">
      <x-import component-from-global-scope="InriverDesignSystem_4656de.Select" label="Field type" size="md" value="{{ fieldType }}" on-change="{{ onFieldTypeChange }}" options="{{ fieldTypeOptions }}" placeholder="Field type" hint-size="100%,56px"></x-import>
      <x-import component-from-global-scope="InriverDesignSystem_4656de.Select" label="Automation type" size="md" value="{{ automationType }}" on-change="{{ onAutomationTypeChange }}" options="{{ automationTypeOptions }}" placeholder="Automation type" hint-size="100%,56px"></x-import>
      <x-import component-from-global-scope="InriverDesignSystem_4656de.TextField" label="Value" size="md" value="{{ value }}" on-change="{{ onValueChange }}" hint-size="100%,56px"></x-import>
    </div>

    <div style="display:flex;justify-content:flex-end;gap:12px;padding:16px 24px 24px;flex-shrink:0;">
      <button type="button" sc-camel-on-click="{{ goToMain }}" style="height:40px;padding:0 22px;border:1px solid #c2c6d8;background:#fff;color:#0b2d6e;border-radius:5px;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;cursor:pointer;" style-hover="background:#ebf1fc;">Back</button>
      <button type="button" sc-camel-on-click="{{ addFieldAutomation }}" disabled="{{ addDisabled }}" style="height:40px;padding:0 26px;border:none;background:{{ addBg }};color:{{ addColor }};border-radius:5px;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;letter-spacing:0.1px;cursor:{{ addCursor }};">Add</button>
    </div>
    </sc-if>
  </aside>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = {
    panelOpen: true,
    name: 'Entity Automation',
    view: 'main',
    automations: [],
    editIndex: null,
    fieldType: '',
    automationType: 'Static Value',
    value: '',
  };
  renderVals() {
    const s = this.state;
    const valid = s.fieldType.length > 0 && s.automationType.length > 0;
    return {
      panelOpen: s.panelOpen,
      addDisabled: !valid,
      addBg: valid ? '#0b2d6e' : 'rgba(11,45,110,0.12)',
      addColor: valid ? '#fff' : 'rgba(25,27,36,0.38)',
      addCursor: valid ? 'pointer' : 'not-allowed',
      openPanel: () => this.setState({ panelOpen: true }),
      closePanel: () => this.setState({ panelOpen: false }),
      name: s.name,
      counter: `${s.name.length} / 50`,
      onNameChange: (e) => this.setState({ name: e.target.value.slice(0, 50) }),
      showMain: s.view === 'main',
      showField: s.view === 'field',
      goToField: () => this.setState({ view: 'field', editIndex: null, fieldType: '', automationType: 'Static Value', value: '' }),
      goToMain: () => this.setState({ view: 'main' }),
      fieldType: s.fieldType,
      onFieldTypeChange: (v) => this.setState({ fieldType: v }),
      fieldTypeOptions: ['Text', 'Localized text', 'Number', 'Boolean', 'Date', 'Media'],
      automationType: s.automationType,
      onAutomationTypeChange: (v) => this.setState({ automationType: v }),
      automationTypeOptions: ['Static Value', 'Copy from field', 'Clear value', 'Expression'],
      value: s.value,
      onValueChange: (e) => this.setState({ value: e.target.value }),
      fieldAutomations: s.automations.map((a, i) => ({
        title: a.fieldType || 'Untitled field',
        detail: a.value ? a.automationType + ' \u00b7 ' + a.value : a.automationType,
        edit: () => this.setState({ view: 'field', editIndex: i, fieldType: a.fieldType, automationType: a.automationType, value: a.value }),
        remove: () => this.setState((st) => ({ automations: st.automations.filter((_, j) => j !== i) })),
      })),
      addFieldAutomation: () => this.setState((st) => {
        const item = { fieldType: st.fieldType, automationType: st.automationType, value: st.value };
        const list = st.editIndex === null ? [...st.automations, item] : st.automations.map((a, i) => (i === st.editIndex ? item : a));
        return { automations: list, view: 'main', editIndex: null };
      }),
      navItems: [
        { label: 'Home', icon: 'home' },
        { label: 'Products', icon: 'inventory_2' },
        { label: 'Media', icon: 'perm_media' },
        { label: 'Channels', icon: 'hub' },
        { label: 'Workflow', icon: 'account_tree', active: true },
      ],
      navFooter: [{ label: 'Settings', icon: 'settings' }],
    };
  }
}

</script>
</body>
</html>
