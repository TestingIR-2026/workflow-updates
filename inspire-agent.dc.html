<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/inflow-design-system-react-4656de98-77ff-4a43-9b32-0fad2779965b/inriver-design-tokens.css">
  <link rel="stylesheet" href="_ds/inflow-design-system-react-4656de98-77ff-4a43-9b32-0fad2779965b/styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined">
  <script src="_ds/inflow-design-system-react-4656de98-77ff-4a43-9b32-0fad2779965b/_ds_bundle.js"></script>
  <style>
    body { margin: 0; background: #ebf1fc; font-family: 'Inter', sans-serif; }
    a { color: #0b2d6e; }
    a:hover { color: #003687; }
    @keyframes ivPanelIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  </style>
</helmet>

<div style="display:flex;height:100vh;width:100%;overflow:hidden;background:#ebf1fc;">
  <x-import component-from-global-scope="InriverDesignSystem_4656de.InriverAppNav" items="{{ navItems }}" footer="{{ navFooter }}" hint-size="80px,100%"></x-import>

  <div style="flex:1;display:flex;flex-direction:column;min-width:0;">
    <x-import component-from-global-scope="InriverDesignSystem_4656de.InriverGlobalHeader" logo-src="assets/inriver-logo-dark.png" search-placeholder="Search" avatar-text="AB" hint-size="100%,64px"></x-import>

    <div style="display:flex;align-items:center;gap:16px;min-height:76px;flex-shrink:0;padding:10px 24px;background:#ebf1fc;">
      <div style="font-size:22px;font-weight:700;color:#0b2d6e;letter-spacing:0.15px;line-height:1.2;">Page title</div>
      <button type="button" sc-camel-on-click="{{ openPanel }}" style="margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border:none;background:#0b2d6e;color:#fff;border-radius:5px;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;letter-spacing:0.1px;cursor:pointer;flex-shrink:0;" style-hover="background:#003687;">
        <span class="material-icons-outlined" style="font-size:20px;color:#fff;flex-shrink:0;">add</span>
        Open panel
      </button>
    </div>

    <div style="flex:1;background:#fff;overflow:auto;"></div>
  </div>
</div>

<sc-if value="{{ panelOpen }}" hint-placeholder-val="{{ true }}">
  <aside style="position:fixed;top:0;right:0;width:540px;height:100vh;background:#fff;border-left:1px solid #c2c6d8;box-shadow:-8px 0 28px rgba(0,0,0,0.16);z-index:50;display:flex;flex-direction:column;font-family:'Inter',sans-serif;animation:ivPanelIn .22s ease-out;">

    <div style="display:flex;align-items:center;gap:14px;padding:16px 24px;flex-shrink:0;">
      <div style="font-size:22px;font-weight:700;color:#0b2d6e;letter-spacing:0.15px;">Inspire AI Agent</div>
      <span class="material-icons-outlined" sc-camel-on-click="{{ closePanel }}" style="margin-left:auto;font-size:24px;color:#0b2d6e;flex-shrink:0;cursor:pointer;">close</span>
    </div>

    <div style="flex:1;overflow:auto;padding:8px 24px 24px;">
      <x-import component-from-global-scope="InriverDesignSystem_4656de.TextField" label="Name" size="md" value="{{ name }}" on-change="{{ onNameChange }}" maxlength="50" hint-size="100%,56px"></x-import>
      <div style="margin-top:4px;text-align:right;font-size:12px;color:var(--color-on-surface-variant);">{{ counter }}</div>

      <div style="margin-top:16px;font-size:14px;font-weight:700;color:#0b2d6e;letter-spacing:0.15px;">Agent Settings</div>

      <div style="margin-top:20px;">
        <x-import component-from-global-scope="InriverDesignSystem_4656de.Select" label="Agent Type" value="{{ agentType }}" on-change="{{ onAgentTypeChange }}" options="{{ agentTypeOptions }}" size="md" placeholder="" hint-size="100%,56px"></x-import>
      </div>

      <div data-menu-root="1" style="margin-top:20px;position:relative;">
        <div sc-camel-on-click="{{ toggleFieldMenu }}" style="position:relative;display:flex;align-items:center;gap:8px;height:56px;box-sizing:border-box;padding:0 40px 0 10px;border:1px solid #727787;border-radius:4px;background:#fff;cursor:pointer;">
          <span style="position:absolute;top:0;left:8px;transform:translateY(-50%);padding:0 4px;background:#fff;font-size:12px;color:var(--color-on-surface-variant);">Field Types</span>
          <sc-for list="{{ fieldChips }}" as="chip" hint-placeholder-count="1">
            <x-import component-from-global-scope="InriverDesignSystem_4656de.Chip" label="{{ chip.label }}" variant="filled" size="sm" on-delete="{{ chip.remove }}" hint-size="auto,24px"></x-import>
          </sc-for>
          <span class="material-icons-outlined" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:22px;color:var(--color-on-surface-variant);">expand_more</span>
        </div>
        <sc-if value="{{ fieldMenuOpen }}" hint-placeholder-val="{{ false }}">
          <ul style="position:absolute;top:60px;left:0;right:0;z-index:60;list-style:none;margin:0;padding:4px 0;background:#fff;border:1px solid #c2c6d8;border-radius:5px;box-shadow:0 4px 16px rgba(11,45,110,0.12);max-height:260px;overflow:auto;">
            <sc-for list="{{ fieldOptions }}" as="opt" hint-placeholder-count="4">
              <li sc-camel-on-click="{{ opt.toggle }}" style="display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;font-size:14px;color:#191b24;background:{{ opt.bg }};">
                <span style="flex:1;">{{ opt.label }}</span>
                <sc-if value="{{ opt.selected }}" hint-placeholder-val="{{ false }}"><span class="material-icons-outlined" style="font-size:18px;color:#0b2d6e;">check</span></sc-if>
              </li>
            </sc-for>
          </ul>
        </sc-if>
      </div>

      <div data-menu-root="1" style="margin-top:20px;position:relative;">
        <div sc-camel-on-click="{{ toggleLangMenu }}" style="position:relative;display:flex;align-items:center;gap:8px;height:56px;box-sizing:border-box;padding:0 40px 0 10px;border:1px solid #727787;border-radius:4px;background:#fff;cursor:pointer;">
          <span style="position:absolute;top:0;left:8px;transform:translateY(-50%);padding:0 4px;background:#fff;font-size:12px;color:var(--color-on-surface-variant);">Languages to generate</span>
          <sc-for list="{{ langChips }}" as="chip" hint-placeholder-count="1">
            <x-import component-from-global-scope="InriverDesignSystem_4656de.Chip" label="{{ chip.label }}" variant="filled" size="sm" on-delete="{{ chip.remove }}" hint-size="auto,24px"></x-import>
          </sc-for>
          <span class="material-icons-outlined" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:22px;color:var(--color-on-surface-variant);">expand_more</span>
        </div>
        <sc-if value="{{ langMenuOpen }}" hint-placeholder-val="{{ false }}">
          <ul style="position:absolute;top:60px;left:0;right:0;z-index:60;list-style:none;margin:0;padding:4px 0;background:#fff;border:1px solid #c2c6d8;border-radius:5px;box-shadow:0 4px 16px rgba(11,45,110,0.12);max-height:260px;overflow:auto;">
            <sc-for list="{{ langOptions }}" as="opt" hint-placeholder-count="4">
              <li sc-camel-on-click="{{ opt.toggle }}" style="display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;font-size:14px;color:#191b24;background:{{ opt.bg }};">
                <span style="flex:1;">{{ opt.label }}</span>
                <sc-if value="{{ opt.selected }}" hint-placeholder-val="{{ false }}"><span class="material-icons-outlined" style="font-size:18px;color:#0b2d6e;">check</span></sc-if>
              </li>
            </sc-for>
          </ul>
        </sc-if>
      </div>

      <div style="margin-top:20px;">
        <x-import component-from-global-scope="InriverDesignSystem_4656de.Checkbox" checked="{{ overwrite }}" on-change="{{ toggleOverwrite }}" label="Overwrite existing field value" hint-size="auto,20px"></x-import>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px;padding:16px 24px 24px;flex-shrink:0;">
      <div style="display:flex;justify-content:flex-end;gap:12px;">
      <button type="button" sc-camel-on-click="{{ closePanel }}" style="height:40px;padding:0 22px;border:1px solid #c2c6d8;background:#fff;color:#0b2d6e;border-radius:5px;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;cursor:pointer;" style-hover="background:#ebf1fc;">Cancel</button>
      <button type="button" style="height:40px;padding:0 26px;border:none;background:#0b2d6e;color:#fff;border-radius:5px;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;letter-spacing:0.1px;cursor:pointer;" style-hover="background:#003687;">Done</button>
      </div>
      <div style="text-align:right;white-space:nowrap;font-size:12px;line-height:16px;color:var(--color-on-surface-variant);">AI can make mistakes. Check important info.</div>
    </div>
  </aside>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
const FIELDS = ['Product name', 'Short description', 'Long description', 'Marketing copy', 'SEO title'];
const LANGS = ['English', 'German', 'French', 'Swedish', 'Spanish'];

class Component extends DCLogic {
  state = {
    panelOpen: true,
    name: 'Inspire AI Agent',
    agentType: 'Inspire Generate Agent',
    fields: ['Product name'],
    langs: ['English'],
    overwrite: true,
    fieldMenuOpen: false,
    langMenuOpen: false,
  };

  toggleIn(key, v) {
    this.setState((s) => {
      const arr = s[key];
      return { [key]: arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v] };
    });
  }


  componentDidMount() {
    this._onDocDown = (e) => {
      if (e.target.closest && e.target.closest('[data-menu-root]')) return;
      const off = {};
      if (this.state.fieldMenuOpen) off.fieldMenuOpen = false;
      if (this.state.langMenuOpen) off.langMenuOpen = false;
      if (Object.keys(off).length) this.setState(off);
    };
    document.addEventListener('mousedown', this._onDocDown, true);
  }

  componentWillUnmount() {
    document.removeEventListener('mousedown', this._onDocDown, true);
  }

  renderVals() {
    const s = this.state;
    const chips = (key) => s[key].map((label) => ({
      label,
      remove: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.toggleIn(key, label); },
    }));
    const opts = (key, list) => list.map((label) => ({
      label,
      selected: s[key].includes(label),
      bg: s[key].includes(label) ? '#f1f6fe' : 'transparent',
      toggle: (e) => { e.stopPropagation(); this.toggleIn(key, label); },
    }));
    return {
      panelOpen: s.panelOpen,
      openPanel: () => this.setState({ panelOpen: true }),
      closePanel: () => this.setState({ panelOpen: false }),
      name: s.name,
      counter: `${s.name.length} / 50`,
      onNameChange: (e) => this.setState({ name: e.target.value.slice(0, 50) }),
      agentType: s.agentType,
      onAgentTypeChange: (v) => this.setState({ agentType: v }),
      agentTypeOptions: ['Inspire Generate Agent', 'Inspire Translate Agent', 'Inspire Enrich Agent'],
      fieldChips: chips('fields'),
      langChips: chips('langs'),
      fieldOptions: opts('fields', FIELDS),
      langOptions: opts('langs', LANGS),
      fieldMenuOpen: s.fieldMenuOpen,
      langMenuOpen: s.langMenuOpen,
      toggleFieldMenu: () => this.setState((st) => ({ fieldMenuOpen: !st.fieldMenuOpen, langMenuOpen: false })),
      toggleLangMenu: () => this.setState((st) => ({ langMenuOpen: !st.langMenuOpen, fieldMenuOpen: false })),
      overwrite: s.overwrite,
      toggleOverwrite: (v) => this.setState({ overwrite: v }),
      navItems: [
        { label: 'Home', icon: 'home' },
        { label: 'Products', icon: 'inventory_2' },
        { label: 'Media', icon: 'perm_media' },
        { label: 'Channels', icon: 'hub' },
        { label: 'Workflow', icon: 'account_tree', active: true },
      ],
      navFooter: [{ label: 'Settings', icon: 'settings' }],
    };
  }
}

</script>
</body>
</html>
